version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # Minor and patch updates together; each major update gets its own pull request.
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # ESLint and TypeScript follow the versions of n8n's node template (@n8n/node-cli),
      # which does not support their next major versions yet.
      - dependency-name: eslint
        update-types: [version-update:semver-major]
      - dependency-name: typescript
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
